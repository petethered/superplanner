    <line x1="100" x2="78" y1="0" y2="0"/>
    <line x1="-100" x2="-78" y1="0" y2="0"/>
    <line x1="0" x2="0" y1="-100" y2="-78"/>
    <line x1="0" x2="0" y1="100" y2="78"/>
